name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish

  binaries:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    # Build on macOS so the darwin binaries get signed; unsigned binaries do
    # not run on Apple silicon.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # install.sh downloads bstack-<os>-<arch> from the latest release.
      - name: Build binaries
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun_target="bun-$target"
            case "$target" in *-x64) bun_target="$bun_target-baseline" ;; esac
            bun build src/cli.ts --compile --minify --target="$bun_target" --outfile="bin/bstack-$target"
          done

      - name: Smoke test
        run: bin/bstack-darwin-arm64 --version

      - name: Upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag_name }}" bin/bstack-*
