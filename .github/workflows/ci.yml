name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
      - run: pnpm run lint
      - run: pnpm run format-check
      - run: pnpm run type-check
      - run: pnpm run build
      - run: pnpm run test
